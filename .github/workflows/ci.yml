name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer
        run: npm run build

      - name: Syntax-check main process
        shell: bash
        run: for f in electron/*.cjs; do node --check "$f"; done

      # The suites that don't open a window: source edits, CI mode, page tools.
      # New on hosted runners, so a failure here is reported without failing the build.
      - name: Tests
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: npm test -- --quick

      - name: Package (unpacked, smoke test)
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
